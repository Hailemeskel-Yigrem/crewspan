[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "relayops-sdk"
version = "0.1.0"
description = "Python client for the RelayOps API"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
]

[tool.setuptools.packages.find]
where = ["src"]
