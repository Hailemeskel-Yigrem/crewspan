[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crewspan-api"
version = "0.1.0"
description = "Crewspan multi-tenant field service operations API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy[asyncio]>=2.0.25",
    "asyncpg>=0.29.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "alembic>=1.13.0",
    "redis>=5.0.0",
    "structlog>=24.1.0",
    "pyjwt[crypto]>=2.8.0",
    "bcrypt>=4.1.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
# The gate enforces the error classes that have actually produced 500s here --
# undefined names and attributes, bad calls, wrong return types. The disabled
# codes are annotation debt in the domain layer (SQLAlchemy Mapped[...] columns
# assigned plain values, Pydantic field types used as annotations); re-enable
# them one at a time as the annotations are tightened.
disable_error_code = ["assignment", "arg-type", "valid-type", "call-overload"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
show_missing = true
# A floor, not a target: set just under the current measured figure so a
# regression fails CI. Raise it as tests are added.
fail_under = 70
# pydantic>=2.6 — v2 migration complete
