# Repo-wide lint configuration. `make lint` and CI both run `ruff check` from
# the repository root, so the rules that gate a pull request live here rather
# than in each app's pyproject.toml.

line-length = 100
target-version = "py311"

exclude = [
    ".venv",
    ".venv-audit",
    "apps/api/alembic/versions",
    "node_modules",
]

[lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # import sorting
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "S",   # flake8-bandit (security)
]
ignore = [
    "E501",   # line length is enforced by the formatter, not the linter
    "B008",   # FastAPI's Depends()/Query() defaults are the framework idiom
    "UP042",  # str+Enum -> StrEnum changes str() output; not a safe sweep
]

[lint.per-file-ignores]
# Tests legitimately use assert, hardcoded fixture credentials, and bind-all hosts.
"**/tests/**" = ["S101", "S105", "S106", "S104"]
"scripts/seed.py" = ["S106"]

[lint.isort]
known-first-party = ["app", "worker", "crewspan_common", "crewspan_sdk"]
