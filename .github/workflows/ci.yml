name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  api-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: crewspan
          POSTGRES_PASSWORD: crewspan
          POSTGRES_DB: crewspan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install API dependencies
        run: |
          pip install -r apps/api/requirements.lock.txt
          pip install pytest pytest-asyncio pytest-cov ruff mypy
          pip install -e packages/common -e packages/sdk
      - name: Lint
        run: ruff check apps packages scripts
      - name: Typecheck
        working-directory: apps/api
        run: mypy app
      - name: Test with coverage gate
        working-directory: apps/api
        env:
          CREWSPAN_DATABASE_URL: postgresql+asyncpg://crewspan:crewspan@localhost:5432/crewspan_test
        run: pytest tests -v --cov=app --cov-report=term-missing

  web-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test with coverage gate
        run: npm run test:coverage
      - name: Build
        run: npm run build

  worker-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install worker dependencies
        run: |
          pip install -r apps/worker/requirements.lock.txt
          pip install pytest
      - name: Test
        working-directory: apps/worker
        run: pytest tests -v

  audit-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Audit Python dependencies
        run: |
          pip install pip-audit
          pip-audit -r apps/api/requirements.lock.txt
          pip-audit -r apps/worker/requirements.lock.txt
      - name: Audit npm dependencies
        working-directory: apps/web
        run: npm audit --audit-level=high
